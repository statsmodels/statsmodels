# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

parameters:
  # defaults for any parameters that are not specified
  name: ''
  vmImage: ''


jobs:

- job: ${{ parameters.name }}Test
  pool:
    vmImage: ${{ parameters.vmImage }}
  strategy:
    matrix:
      # Windows keeps sentinel coverage for the oldest supported Python,
      # the newest supported Python, and free-threaded Python.
      python310_win_compat:
        python.version: '3.10'
        python.architecture: 'x64'
      python313_win_latest:
        python.version: '3.13'
        python.architecture: 'x64'
      python314t_win_latest:
        python.version: '3.14'
        python.architecture: 'x64'
        python.freethreaded: true
    maxParallel: 10

  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
      architecture: '$(python.architecture)'
    displayName: 'Use Python $(python.version) $(python.architecture)'

  - pwsh: |
      # Since version 0.283.0 UsePythonVersion rejects the architecture
      # x64-freethreaded ("Invalid architecture ... Allowed values are x86,
      # x64, arm64") and has no other way to select a free-threaded build. The
      # task above provides the interpreter that installs uv, uv installs the
      # free-threaded Python, and its virtual environment goes first on PATH.
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      python -m pip install uv
      python -m uv python install "${env:PYTHON_VERSION}t"
      $venv = Join-Path $env:AGENT_TEMPDIRECTORY 'venv-freethreaded'
      python -m uv venv --seed --python "${env:PYTHON_VERSION}t" $venv
      # Fail here rather than silently testing a build that has a GIL
      & "$venv\Scripts\python.exe" -c "import sys, sysconfig; print(sys.version); assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1, 'not a free-threaded build'"
      Write-Host "##vso[task.prependpath]$venv\Scripts"
    displayName: 'Install free-threaded Python $(python.version)'
    condition: eq(variables['python.freethreaded'], 'true')

  - script: |
      python -m pip install --upgrade pip setuptools wheel
    displayName: 'Update essentials'

  - pwsh: |
      python -m pip install -r requirements.txt
      python -m pip install -r requirements-dev.txt
    displayName: 'Install dependencies'

  - pwsh: |
      python -m pip list
    displayName: 'List Configuration'

  - pwsh: |
      python -m pip install -vv --no-build-isolation --config-settings=editable-verbose=true --editable .
    displayName: 'Build Cython Extensions'

  - pwsh: |
      pytest statsmodels --skip-examples --skip-slow --skip-high-memory --junitxml=junit/test-results.xml -n 2 --durations=50
    displayName: 'Run pytest'

  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/test-results.xml'
      testRunTitle: 'Python $(python.version)'
    condition: succeededOrFailed()
