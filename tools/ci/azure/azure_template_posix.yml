# THROWAWAY BRANCH: only the python_314t_latest job, run without xdist and with
# verbose output and long duration reports to find out why this job sometimes
# runs into the 60 minute limit. Do not merge.

parameters:
  # defaults for any parameters that are not specified
  name: ''
  vmImage: ''


jobs:

- job: ${{ parameters.name }}Test
  # The default limit is 60 minutes, and a run without xdist is slower than the
  # normal job, so give it room to finish or to report where it hangs.
  timeoutInMinutes: 200
  cancelTimeoutInMinutes: 10
  pool:
    vmImage: ${{ parameters.vmImage }}
  variables:
    PYTEST_PATTERN: 'not slow and not joblib'
  strategy:
    matrix:
      ${{ if eq(parameters.name, 'Linux') }}:
        python_314t_latest:
          python.version: '3.14'
          python.architecture: 'x64-freethreaded'
          PANDAS_VERSION: 3
          coverage: true
          PYTEST_PATTERN: '(not slow or slow) and not joblib'
    maxParallel: 20

  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
      architecture: '$(python.architecture)'
    displayName: 'Use Python $(python.version) $(python.architecture)'

  - script: |
      source tools/ci/azure/install-posix.sh
    displayName: 'Install dependencies'

  - script: |
       python -m pip install -vv --no-build-isolation --upgrade-strategy only-if-needed --config-settings=editable-verbose=true --editable .
    displayName: 'Install statsmodels (editable)'

  - script: python -m pip list
    displayName: 'List Configuration (PyPI)'

  - script: |
      nproc
      free -m
      df -h . /tmp
      cat /proc/cpuinfo | grep -m1 'model name'
      uname -a
      python -c "import sys, sysconfig; print(sys.version); print('GIL enabled:', sys._is_gil_enabled()); print('Py_GIL_DISABLED', sysconfig.get_config_var('Py_GIL_DISABLED'))"
    displayName: 'Machine and interpreter'

  - script: |
      echo "Testing editable install, one process (no xdist), verbose"
      if [[ ${COVERAGE} == "true" ]]; then
        export COVERAGE_OPTS="--cov-config pyproject.toml --cov=statsmodels --cov-report xml:coverage.xml --cov-report term"
      fi
      # faulthandler_timeout dumps the stack of every thread when one test runs
      # for more than 5 minutes, and timeout stops pytest cleanly (SIGINT, then
      # SIGKILL) before the job limit so that the log is not lost.
      # Once a minute: memory, swap, load and the largest processes. If the runner
      # freezes (Azure reported that the agent did not answer the cancellation
      # request), the last lines show whether it ran out of memory.
      (
        while true; do
          echo "[monitor] $(date -u +%H:%M:%S) $(free -m | awk 'NR==2{printf "used=%sMB avail=%sMB", $3, $7} NR==3{printf " swap=%sMB", $3}') load=$(cut -d' ' -f1-3 /proc/loadavg)"
          ps -eo rss=,pid=,args= --sort=-rss | head -3 | cut -c1-110 | sed 's/^/[monitor]   /'
          sleep 60
        done
      ) &
      MONITOR_PID=$!
      trap 'kill ${MONITOR_PID} 2>/dev/null' EXIT
      CMD="pytest -m \"${PYTEST_PATTERN}\" --skip-examples --junitxml=junit/test-results.xml -v -rfE --durations=500 --durations-min=0.5 -o faulthandler_timeout=300 ${COVERAGE_OPTS} statsmodels"
      echo timeout --signal=INT --kill-after=120 10200 ${CMD}
      eval timeout --signal=INT --kill-after=120 10200 ${CMD}
      PYTEST_EXIT=$?
      kill ${MONITOR_PID}
      exit ${PYTEST_EXIT}
    displayName: 'Run tests (editable)'
    timeoutInMinutes: 190
    condition: ne(variables['test.install'], 'true')

  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/test-results.xml'
      testRunTitle: 'Python $(python.version)'
    condition: succeededOrFailed()
