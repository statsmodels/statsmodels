name: Test Emscripten/Pyodide build using CIBW

on:
  pull_request:
    branches:
      - main
      - maintenance/**

env:
  FORCE_COLOR: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  build-wasm-emscripten:
    permissions:
      contents: read  # to fetch code (actions/checkout)
    name: Pyodide test
    runs-on: ubuntu-latest
    # To enable this workflow on a fork, comment out:
    if: github.repository == 'statsmodels/statsmodels'
    steps:
      - name: Checkout statsmodels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-tags: true
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 #v4.2.0
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: "cp313-*"
          CIBW_TEST_COMMAND: python -c "import statsmodels; statsmodels.test(['-ra', '--skip-examples', '--skip-slow'], exit=True)"
          CIBW_TEST_REQUIRES: pytest pytest-cov pytest-run-parallel pytest-randomly matplotlib
