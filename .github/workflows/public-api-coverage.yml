name: Public API coverage ratchet

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  coverage-ratchet:
    name: Check public API coverage has not regressed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout statsmodels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas cython
          python -m pip install -r requirements-dev.txt

      - name: Install statsmodels (editable)
        run: python -m pip install --no-build-isolation --editable .

      - name: Run test suite with coverage
        run: |
          pytest -m "not slow and not joblib" --skip-examples -n auto \
            --dist loadscope --durations=25 --cov-config pyproject.toml \
            --cov=statsmodels --cov-report json:coverage.json statsmodels

      - name: Check public API coverage has not regressed
        run: |
          python tools/check_public_api_coverage.py coverage.json \
            --baseline tools/public_api_coverage_baseline.json
